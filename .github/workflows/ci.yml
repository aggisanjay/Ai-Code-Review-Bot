name: ReviewFlow AI CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Database
        run: |
          npm run db:generate
          npm run db:push
          npm run db:seed
        env:
          DATABASE_URL: "file:./packages/database/prisma/dev.db"

      - name: Run Test Suite (Unit, Security, Integration)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./packages/database/prisma/dev.db"

      - name: Build Next.js Web App
        run: npm run build --workspace=@reviewflow/web
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
          NEXT_PUBLIC_DEMO_MODE: "true"
